apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: small-room
      tier: frontend
  template:
    metadata:
      labels:
        app: small-room
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ejeet2026/small-room-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: small-room
      tier: backend
  template:
    metadata:
      labels:
        app: small-room
        tier: backend
    spec:
      containers:
        - name: backend
          image: ejeet2026/small-room-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: database
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: chatroom
            - name: DB_USER
              value: chatroom
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: small-room-db
                  key: password
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: small-room
      tier: database
  template:
    metadata:
      labels:
        app: small-room
        tier: database
    spec:
      containers:
        - name: database
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: chatroom
            - name: POSTGRES_USER
              value: chatroom
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: small-room-db
                  key: password
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: database-data