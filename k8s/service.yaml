apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: small-room
    tier: frontend
  ports:
    - name: http
      nodePort: 30080
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: small-room
    tier: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  type: ClusterIP
  selector:
    app: small-room
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres